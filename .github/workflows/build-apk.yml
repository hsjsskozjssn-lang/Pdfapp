name: Build Pinkora PDF Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Java 17 or newer is required."
            exit 1
          fi

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build

      - name: Package Android project with Capacitor
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Expected APK not found or empty at $APK_PATH"
            find android/app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "${ASSET_DIR}/app-debug.apk"
          if [ ! -f "${ASSET_DIR}/app-debug.apk" ] || [ ! -s "${ASSET_DIR}/app-debug.apk" ]; then
            echo "Release APK preparation failed."
            exit 1
          fi
          echo "asset_path=${ASSET_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$APK_ASSET" ] || [ ! -s "$APK_ASSET" ]; then
            echo "Prepared APK asset is missing or empty."
            exit 1
          fi
          if [ "$(basename "$APK_ASSET")" != "app-debug.apk" ]; then
            echo "Release asset filename must be exactly app-debug.apk"
            exit 1
          fi
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "${APK_ASSET}#app-debug.apk" \
            --title "Debug APK Build #${GITHUB_RUN_NUMBER}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "Automatically generated Pinkora PDF debug APK via GitHub Actions.
          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit: ${GITHUB_SHA}
          - Intended for testing only (not a Play Store production release, signed with debug keystore)."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release view "$TAG"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "Backup GitHub Actions artifact \`app-debug-apk\` is also available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the APK build and Actions artifact 'app-debug-apk' remain available."
          fi
